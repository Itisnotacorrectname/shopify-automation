name: Deploy Shopify Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: automation
      
      - name: Clone theme repository
        run: |
          cd automation
          git clone https://github.com/Itisnotacorrectname/hyl-shopify-theme.git theme || \
          git clone https://github.com/Itisnotacorrectname/HYL独立站.git HYL独立站 || \
          echo "Theme repository not found, will use local files"
          ls -la
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd automation && pip install -r requirements.txt
      
      - name: Deploy theme
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_THEME_ID: ${{ secrets.SHOPIFY_THEME_ID }}
        run: |
          cd automation && python cli.py deploy --full
      
      - name: Generate sitemap
        if: success()
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          python cli.py sitemap -o sitemap.xml
      
      - name: Upload sitemap
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: sitemap.xml

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flake8 pyyaml
      
      - name: Lint Python code
        run: |
          python -m py_compile cli.py
          python -m py_compile src/*.py
          python -m py_compile deploy/*.py
          python -c "import yaml; yaml.safe_load(open('config.yaml'))"