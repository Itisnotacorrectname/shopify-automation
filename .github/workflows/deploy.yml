name: Deploy Shopify Theme

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: automation
      
      - name: Clone theme repository
        run: |
          cd automation
          git clone https://github.com/Itisnotacorrectname/hyl-shopify-theme.git theme || \
          echo "Theme not found, using current repo"
          ls -la
      
      - name: Package theme
        run: |
          cd automation
          if [ -d "theme" ]; then
            cd theme && zip -r ../theme.zip . && cd ..
          else
            zip -r theme.zip . --exclude "*.git*" --exclude "shopify-automation/*"
          fi
          ls -la *.zip
      
      - name: Upload theme package
        uses: actions/upload-artifact@v4
        with:
          name: shopify-theme-zip
          path: automation/theme.zip

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install flake8 pyyaml
      
      - name: Lint Python code
        run: |
          python -m py_compile cli.py
          python -m py_compile src/*.py
          python -m py_compile deploy/*.py
          python -c "import yaml; yaml.safe_load(open('config.yaml'))"